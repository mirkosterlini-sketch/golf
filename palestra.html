<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}[hidden]{display:none!important}</style>
<title>Palestra Mirko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una schermata per esercizio, pensata per orologio rotondo e telefono; tutto centrato su un asse verticale */
:root{
  --bg:#0d0f12; --panel:#181b20; --line:#2a2f37;
  --fg:#eef0f2; --muted:#9097a1; --machine:#5d6673;
  --accent:#ffb23e; --accent-ink:#1a1204; --ok:#5fd38d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:clamp(13px,4vw,16px);-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
@media (max-width:330px){.wrap{padding-inline:11vw;padding-block:9vw 12vw;gap:7px}}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2em;text-transform:uppercase}
h2{font-size:1.55em}
.sub{color:var(--muted);margin:0;font-size:.9em;line-height:1.35;max-width:34ch}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-size:.85em;font-weight:600}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{width:100%;min-height:52px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:1.35em;text-transform:uppercase;letter-spacing:.04em}
.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px;width:100%;justify-content:center;align-items:center}
.small{min-height:40px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.scheda{width:100%;padding:14px 16px;border-radius:22px;background:var(--panel);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:4px}
.scheda b{font-family:var(--display);font-size:1.6em;text-transform:uppercase}
.scheda span{color:var(--muted);font-size:.85em;line-height:1.3}
.scheda.next{border-color:var(--accent)}
.scheda .tag{color:var(--accent);font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.75em}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85em;font-variant-numeric:tabular-nums}
.top button{background:none;color:var(--muted);padding:6px 4px}
.draw{width:100%;max-width:260px;aspect-ratio:160/110}
.draw svg{width:100%;height:100%;display:block}
.dove{color:var(--muted);font-size:.82em;line-height:1.35;margin:0;max-width:32ch}
.target{font-family:var(--display);font-size:2.1em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.target small{font-size:.45em;color:var(--muted);font-family:var(--body);font-weight:500;display:block;margin-top:2px}
.pips{display:flex;gap:6px;justify-content:center}
.pip{width:26px;height:8px;border-radius:4px;background:var(--line)}
.pip.done{background:var(--ok)}
.pip.cur{background:var(--accent)}
.peso{display:flex;align-items:center;gap:10px}
.peso button{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:1.3em;font-weight:600}
.peso output{font-family:var(--display);font-size:1.5em;font-weight:700;min-width:4.2ch;font-variant-numeric:tabular-nums}
.peso output small{font-size:.55em;color:var(--muted)}
.tip{font-size:.8em;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin:0;line-height:1.35;max-width:34ch}
.timer{position:relative;width:min(70vw,220px);aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:3.2em;font-variant-numeric:tabular-nums}
.timer .num small{font-family:var(--body);font-size:.25em;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
.navx{display:flex;justify-content:space-between;width:100%}
.navx button{background:none;color:var(--muted);font-size:.85em;padding:8px 4px}
.done-list{list-style:none;padding:0;margin:0;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.done-list li{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--panel);border-radius:12px;font-size:.9em}
.done-list li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.m{stroke:var(--machine);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.mf{fill:var(--panel);stroke:var(--machine);stroke-width:2.5}
.p{stroke:var(--fg);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.h{fill:var(--fg)}
.a{stroke:var(--accent);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.af{fill:var(--accent)}
.ar{stroke:var(--accent);fill:none;stroke-width:2;stroke-dasharray:4 4;stroke-linecap:round}
.g{stroke:var(--line);stroke-width:2}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const D = {
 bike:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><circle class="m" cx="52" cy="82" r="14"/><path class="m" d="M52 82 L95 52 M52 82 L48 40 M38 40 L58 40 M88 52 L104 52 M95 52 L100 100 M40 100 L110 100"/><circle class="h" cx="100" cy="20" r="7"/><path class="p" d="M98 28 L94 52 M97 33 L72 40 L52 41 M94 52 L72 66 L60 86"/>`,
 legpress:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M60 100 L148 22 M18 92 L72 92 M42 92 L20 54 M30 92 L30 100 M64 92 L64 100"/><path class="a" d="M104 34 L126 58"/><circle class="h" cx="18" cy="44" r="7"/><path class="p" d="M22 52 L44 84 M44 84 L76 56 L112 48 M28 60 L48 76"/><path class="ar" d="M120 34 L136 20"/>`,
 panca:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><rect class="mf" x="34" y="68" width="88" height="8" rx="3"/><path class="m" d="M48 76 L48 100 M108 76 L108 100"/><circle class="h" cx="128" cy="62" r="7"/><path class="p" d="M120 66 L66 66 M66 66 L54 84 L54 100 M112 64 L108 36 M100 64 L96 36"/><rect class="af" x="92" y="28" width="20" height="7" rx="2"/><path class="ar" d="M80 34 L80 54"/>`,
 lat:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M132 100 L132 10 L76 10 M76 10 L76 28 M70 78 L104 78 M88 78 L88 100 M66 62 L86 62"/><path class="a" d="M44 30 L108 30"/><circle class="h" cx="84" cy="44" r="7"/><path class="p" d="M84 52 L86 78 M80 56 L62 44 L56 31 M88 56 L104 44 L108 31 M86 78 L66 80 L66 100"/><path class="ar" d="M30 34 L30 58"/>`,
 shoulder:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M56 76 L98 76 M98 76 L100 30 M62 76 L62 100 M94 76 L94 100"/><circle class="h" cx="86" cy="22" r="7"/><path class="p" d="M88 30 L88 74 M88 74 L60 76 L58 100 M84 36 L68 40 L68 20 M92 36 L110 40 L112 20"/><rect class="af" x="58" y="12" width="20" height="7" rx="2"/><rect class="af" x="102" y="12" width="20" height="7" rx="2"/><path class="ar" d="M136 22 L136 44"/>`,
 pec:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M80 76 L80 100 M56 100 L104 100 M44 14 L44 100 M116 14 L116 100"/><rect class="mf" x="64" y="70" width="32" height="7" rx="3"/><rect class="mf" x="71" y="26" width="18" height="40" rx="4"/><circle class="h" cx="80" cy="20" r="7"/><path class="p" d="M80 28 L80 70 M74 36 L54 40 L52 26 M86 36 L106 40 L108 26 M76 70 L70 96 M84 70 L90 96"/><rect class="af" x="46" y="14" width="10" height="20" rx="3"/><rect class="af" x="104" y="14" width="10" height="20" rx="3"/><path class="ar" d="M58 10 Q80 0 102 10"/>`,
 plank:`<rect x="20" y="94" width="122" height="6" rx="2" fill="var(--panel)"/><line class="g" x1="10" y1="100" x2="150" y2="100"/><circle class="h" cx="126" cy="66" r="7"/><path class="p" d="M118 72 L40 86 L34 94 M112 74 L112 92 L130 92"/><path class="a" d="M60 80 L96 74" stroke-width="2"/>`,
 tapis:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M22 96 L128 80 M128 80 L136 28 M114 40 L138 34 M22 96 L22 100"/><path class="a" d="M30 94 L120 82" stroke-width="2"/><circle class="h" cx="80" cy="18" r="7"/><path class="p" d="M80 26 L78 56 M78 56 L64 86 M78 56 L94 82 M79 32 L68 48 M79 32 L92 46"/>`,
 goblet:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><circle class="h" cx="84" cy="30" r="7"/><path class="p" d="M84 38 L90 64 M90 64 L66 68 L70 98 M90 64 L74 72 L78 98 M84 44 L74 52"/><rect class="af" x="68" y="40" width="9" height="20" rx="2"/><path class="ar" d="M118 40 L118 80 M112 72 L118 80 L124 72"/>`,
 inclinata:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M36 84 L62 84 M56 84 L92 36 M44 84 L44 100 M70 70 L70 100"/><circle class="h" cx="94" cy="28" r="7"/><path class="p" d="M90 36 L60 78 M60 78 L50 90 L50 100 M84 44 L86 14 M76 54 L78 16"/><rect class="af" x="72" y="8" width="20" height="7" rx="2"/><path class="ar" d="M114 18 L114 40"/>`,
 rematore:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><rect class="mf" x="62" y="70" width="80" height="7" rx="3"/><path class="m" d="M74 77 L74 100 M130 77 L130 100"/><circle class="h" cx="136" cy="46" r="7"/><path class="p" d="M128 50 L94 56 M94 56 L86 100 M94 56 L100 70 L118 70 M124 52 L130 70 M108 54 L106 72"/><rect class="af" x="96" y="72" width="20" height="7" rx="2"/><path class="ar" d="M84 84 L84 62"/>`,
 legcurl:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M46 70 L92 70 M46 70 L40 32 M66 70 L66 100"/><rect class="mf" x="76" y="56" width="26" height="6" rx="3"/><circle class="h" cx="52" cy="22" r="7"/><path class="p" d="M50 30 L58 68 M58 68 L102 66 M102 66 L96 94 M52 38 L80 54"/><circle class="af" cx="104" cy="86" r="6"/><path class="ar" d="M124 70 Q124 94 104 100"/>`,
 alzate:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><circle class="h" cx="80" cy="20" r="7"/><path class="p" d="M80 28 L80 62 M80 62 L72 98 M80 62 L88 98 M80 34 L48 38 M80 34 L112 38"/><path class="ar" d="M76 36 L66 62 M84 36 L94 62"/><rect class="af" x="38" y="32" width="8" height="14" rx="2"/><rect class="af" x="114" y="32" width="8" height="14" rx="2"/>`,
 crunch:`<line class="g" x1="10" y1="100" x2="150" y2="100"/><path class="m" d="M140 100 L140 8 M134 14 L146 14"/><path class="a" d="M140 16 L108 46" stroke-width="2"/><circle class="h" cx="108" cy="64" r="7"/><path class="p" d="M72 72 L100 60 M72 72 L72 96 L44 96 M98 58 L104 48"/><path class="ar" d="M120 76 Q100 90 82 86"/>`
};

const E = {
 risc:{nome:"Riscaldamento",dove:"Cyclette o tapis roulant, a ritmo tranquillo.",tipo:"cardio",min:5,d:"bike",tip:"Deve scaldarti, non stancarti. Respiro normale."},
 camm:{nome:"Camminata in pendenza",dove:"Tapis roulant: pendenza 6-10%, velocità 5,5-6 km/h.",tipo:"cardio",min:25,d:"tapis",tip:"Passo svelto: riesci a parlare ma con un po' di fiato corto. Non appoggiarti ai manici."},
 legpress:{nome:"Leg press",dove:"Macchina dove stai semi-sdraiato e spingi una pedana grande con i piedi.",tipo:"reps",serie:3,rip:"10-12",rec:90,d:"legpress",peso:60,step:5,tip:"Piedi larghi come le spalle. Non bloccare le ginocchia quando distendi."},
 panca:{nome:"Panca piana con manubri",dove:"Panca piatta e due manubri. Sdraiato, spingi i pesi verso l'alto.",tipo:"reps",serie:3,rip:"8-10",rec:90,d:"panca",peso:12,step:2,tip:"Scendi piano fino all'altezza del petto, spingi su senza sbattere i manubri."},
 lat:{nome:"Lat machine",dove:"Macchina alta con una sbarra lunga appesa a un cavo. Seduto, tiri la sbarra in giù.",tipo:"reps",serie:3,rip:"10-12",rec:90,d:"lat",peso:35,step:5,tip:"Tira la sbarra davanti, fino al mento. Petto in fuori, non dondolare."},
 shoulder:{nome:"Lento con manubri",dove:"Panca con lo schienale dritto e due manubri. Spingi i pesi sopra la testa.",tipo:"reps",serie:3,rip:"10",rec:75,d:"shoulder",peso:10,step:2,tip:"Schiena appoggiata allo schienale. Non inarcare la zona lombare."},
 pec:{nome:"Pectoral machine",dove:"Macchina seduto con due bracci o due cuscinetti ai lati: li chiudi davanti al petto. In alternativa croci ai cavi.",tipo:"reps",serie:3,rip:"12-15",rec:60,d:"pec",peso:25,step:5,tip:"Movimento lento, stringi il petto per un secondo quando chiudi."},
 plank:{nome:"Plank",dove:"Sul tappetino, appoggiato su avambracci e punte dei piedi.",tipo:"tempo",serie:3,sec:40,rec:45,d:"plank",tip:"Corpo dritto come una tavola: pancia contratta, sedere non troppo alto."},
 goblet:{nome:"Goblet squat",dove:"Un manubrio tenuto in verticale davanti al petto. Ti accovacci e risali.",tipo:"reps",serie:3,rip:"10-12",rec:90,d:"goblet",peso:14,step:2,tip:"Talloni a terra, schiena dritta. Scendi finché le cosce sono parallele al pavimento."},
 inclinata:{nome:"Panca inclinata con manubri",dove:"Panca con lo schienale alzato a metà e due manubri.",tipo:"reps",serie:3,rip:"8-10",rec:90,d:"inclinata",peso:10,step:2,tip:"Schienale a circa 30°. Lavora la parte alta del petto."},
 rematore:{nome:"Rematore con manubrio",dove:"Panca piatta: un ginocchio e una mano appoggiati, con l'altra mano tiri su un manubrio.",tipo:"reps",serie:3,rip:"10-12 per braccio",rec:75,d:"rematore",peso:14,step:2,tip:"Tira il gomito verso il fianco, non verso la spalla. Fai prima un braccio poi l'altro."},
 legcurl:{nome:"Leg curl",dove:"Macchina seduto con un rullo imbottito dietro le caviglie: lo spingi in giù piegando le gambe.",tipo:"reps",serie:3,rip:"12",rec:60,d:"legcurl",peso:25,step:5,tip:"Movimento controllato anche quando torni su."},
 alzate:{nome:"Alzate laterali",dove:"In piedi con due manubri leggeri. Alzi le braccia di lato fino alle spalle.",tipo:"reps",serie:3,rip:"12-15",rec:60,d:"alzate",peso:6,step:1,tip:"Gomiti leggermente piegati, non salire oltre l'altezza delle spalle."},
 crunch:{nome:"Crunch ai cavi",dove:"In ginocchio davanti alla macchina con i cavi, impugni la corda e pieghi il busto in avanti.",tipo:"reps",serie:3,rip:"12",rec:60,d:"crunch",peso:20,step:5,tip:"Il movimento lo fa la pancia, non le braccia. Arrotonda la schiena."}
};
const S = {
 A:{nome:"Scheda A",lista:["risc","legpress","panca","lat","shoulder","pec","plank","camm"]},
 B:{nome:"Scheda B",lista:["risc","goblet","inclinata","rematore","legcurl","alzate","crunch","camm"]}
};

const store={get(k,d){try{const v=localStorage.getItem("pal."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("pal."+k,JSON.stringify(v))}catch(e){}}};
const app=document.getElementById("app");
let st={s:null,i:0,set:0,log:{}};
let tick=null, wake=null, actx=null;

function vibe(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.35)}catch(e){}}
async function keepAwake(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&st.s)keepAwake()});
function svg(k){return `<svg viewBox="0 0 160 110" role="img" aria-hidden="true">${D[k]}</svg>`}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function stopTick(){if(tick){clearInterval(tick);tick=null}}

function home(){
  stopTick(); st={s:null,i:0,set:0,log:{}};
  const last=store.get("last",null); const nx= last==="A"?"B":"A";
  const card=k=>`<button class="scheda ${k===nx?"next":""}" data-s="${k}">${k===nx?'<span class="tag">Tocca a questa</span>':""}<b>${S[k].nome}</b><span>${S[k].lista.filter(x=>E[x].tipo!=="cardio").map(x=>E[x].nome).join(" · ")}</span></button>`;
  app.innerHTML=`<div class="eyebrow">Allenamento · 45 min</div><h1>Palestra</h1>
  <p class="sub">Alterna le schede: settimana 1 A-B-A, settimana 2 B-A-B.</p>${card(nx)}${card(last?last:"B")}`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.s=b.dataset.s;st.i=0;st.set=0;keepAwake();vibe(40);ex()});
}

function cur(){return E[S[st.s].lista[st.i]]}
function curId(){return S[st.s].lista[st.i]}

function ex(){
  stopTick();
  const L=S[st.s].lista, id=curId(), e=cur();
  let mid="";
  if(e.tipo==="cardio"){
    mid=`<div class="target">${e.min} min<small>${st.i===0?"prima di iniziare":"per finire"}</small></div>
    <button class="big" id="go">Avvia ${e.min}:00</button>`;
  } else {
    const pips=Array.from({length:e.serie},(_,k)=>`<span class="pip ${k<st.set?"done":k===st.set?"cur":""}"></span>`).join("");
    const w=store.get("w."+id,e.peso);
    mid=`<div class="pips" aria-label="Serie ${st.set+1} di ${e.serie}">${pips}</div>
    <div class="target">${e.tipo==="tempo"?e.sec+" s":e.rip}<small>Serie ${st.set+1} di ${e.serie}${e.tipo==="tempo"?"":" · ripetizioni"}</small></div>
    ${e.tipo==="reps"?`<div class="peso"><button id="wm" aria-label="Meno peso">−</button><output id="w">${w}<small> kg</small></output><button id="wp" aria-label="Più peso">+</button></div>`:""}
    <button class="big" id="go">${e.tipo==="tempo"?"Avvia "+e.sec+" s":"Serie fatta"}</button>`;
  }
  app.innerHTML=`<div class="top"><button id="home">✕ Esci</button><span>${S[st.s].nome} · ${st.i+1}/${L.length}</span></div>
  <div class="draw">${svg(e.d)}</div><h2>${e.nome}</h2><p class="dove">${e.dove}</p>${mid}
  <p class="tip">${e.tip}</p>
  <div class="navx"><button id="prev" ${st.i===0?"hidden":""}>‹ Indietro</button><span></span><button id="next">${st.i===L.length-1?"Fine":"Salta"} ›</button></div>`;
  app.querySelector("#home").onclick=home;
  app.querySelector("#prev").onclick=()=>{st.i--;st.set=0;ex()};
  app.querySelector("#next").onclick=nextEx;
  const g=app.querySelector("#go");
  if(e.tipo==="cardio") g.onclick=()=>countdown(e.min*60,"Camminata",()=>{st.log[id]=e.min+" min";nextEx()},e.nome);
  else if(e.tipo==="tempo") g.onclick=()=>countdown(e.sec,"Tieni",()=>setDone(),e.nome);
  else {
    const out=app.querySelector("#w");
    const upd=d=>{let v=Math.max(0,Math.round((store.get("w."+id,e.peso)+d)*10)/10);store.set("w."+id,v);out.innerHTML=v+"<small> kg</small>"};
    app.querySelector("#wm").onclick=()=>upd(-e.step);
    app.querySelector("#wp").onclick=()=>upd(e.step);
    g.onclick=setDone;
  }
  window.scrollTo(0,0);
}

function setDone(){
  const id=curId(), e=cur(); vibe(60);
  st.set++;
  st.log[id]= e.tipo==="reps" ? `${st.set}×${e.rip.split(" ")[0]} · ${store.get("w."+id,e.peso)} kg` : `${st.set}×${e.sec} s`;
  if(st.set>=e.serie){ const nx=S[st.s].lista[st.i+1]; countdown(e.rec,"Recupero",()=>nextEx(),nx?"Poi: "+E[nx].nome:"Ultimo!",true); }
  else countdown(e.rec,"Recupero",()=>ex(),"Poi: serie "+(st.set+1)+" di "+e.serie,true);
}

function nextEx(){ if(st.i>=S[st.s].lista.length-1) return fine(); st.i++; st.set=0; ex(); }

function countdown(sec,label,after,note,adjust){
  stopTick();
  let end=Date.now()+sec*1000, total=sec, done=false;
  const C=2*Math.PI*46;
  app.innerHTML=`<div class="top"><button id="home">✕ Esci</button><span>${S[st.s].nome}</span></div>
  <div class="eyebrow">${label}</div>
  <div class="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" stroke="var(--line)" stroke-width="7" fill="none"/><circle id="ring" cx="50" cy="50" r="46" stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num"><span id="t">${fmt(sec)}</span><small>min:sec</small></div></div>
  <p class="sub">${note||""}</p>
  ${adjust?`<div class="row"><button class="small" id="m15">−15 s</button><button class="small" id="p15">+15 s</button></div>`:""}
  <button class="big ghost" id="skip">${adjust?"Salta recupero":"Ho finito"}</button>`;
  const t=app.querySelector("#t"), ring=app.querySelector("#ring");
  const fin=()=>{if(done)return;done=true;stopTick();vibe([300,150,300]);beep();after()};
  const draw=()=>{const left=(end-Date.now())/1000;t.textContent=fmt(left);ring.style.strokeDashoffset=C*(1-Math.max(0,left)/total);if(left<=3.05&&left>2.8)vibe(80);if(left<=0)fin()};
  tick=setInterval(draw,250); draw();
  app.querySelector("#home").onclick=home;
  app.querySelector("#skip").onclick=fin;
  if(adjust){app.querySelector("#m15").onclick=()=>{end-=15000;draw()};app.querySelector("#p15").onclick=()=>{end+=15000;total+=15;draw()}}
}

function fine(){
  stopTick(); store.set("last",st.s); vibe([200,100,200,100,400]);
  const rows=S[st.s].lista.filter(id=>st.log[id]).map(id=>`<li><span>${E[id].nome}</span><span>${st.log[id]}</span></li>`).join("");
  app.innerHTML=`<div class="eyebrow">${S[st.s].nome} completata</div><h1>Bravo!</h1>
  <p class="sub">Ricordati lo shake proteico. Prossima volta: ${st.s==="A"?"Scheda B":"Scheda A"}.</p>
  <ul class="done-list">${rows||"<li><span>Nessun esercizio segnato</span><span></span></li>"}</ul>
  <button class="big" id="h">Torna all'inizio</button>`;
  app.querySelector("#h").onclick=home;
}

/* scorrimento laterale per cambiare esercizio */
let sx=null,sy=null;
app.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
app.addEventListener("touchend",e=>{if(sx===null||!st.s||tick)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0)nextEx(); else if(st.i>0){st.i--;st.set=0;ex()} }},{passive:true});

home();
</script>

</html>
